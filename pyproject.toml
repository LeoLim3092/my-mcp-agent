[project]
name = "my-mcp-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "mcp[cli]>=2.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "typing-extensions>=4.16.0",
]

[project.scripts]
my-mcp-agent = "my_mcp_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
